<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainingsbord Korfbal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#5B6B87;
    --paper:#F6F6F2;
    --card:#FFFFFF;
    --line:#DADCD3;
    --green:#2F5233;
    --green-soft:#E7EEE4;
    --orange:#E4602F;
    --orange-soft:#FCE6DC;
    --yellow:#F2C94C;
    --blue:#2F6FE4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    padding:24px 16px 64px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  .masthead h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:22px;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    text-transform:uppercase;
  }
  .masthead .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.05em;
    text-transform:uppercase;
  }

  .infobar{
    display:grid;
    grid-template-columns:1fr 1fr 2fr;
    gap:10px;
    margin-bottom:22px;
  }
  .infobar label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:4px;
  }
  .infobar input{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--line);
    background:transparent;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
    color:var(--ink);
    padding:4px 2px;
    outline:none;
  }
  .infobar input:focus{border-bottom-color:var(--green);}

  .block{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:4px;
    margin-bottom:22px;
    overflow:hidden;
  }
  .block-head{
    padding:10px 12px;
    border-bottom:1.5px solid var(--line);
    background:var(--green-soft);
  }
  .title-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .block-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    color:var(--green);
    flex-shrink:0;
  }
  .block-head input[type="text"]{
    flex:1;
    border:none;
    background:transparent;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    outline:none;
    padding:2px 0;
  }
  .block-head input::placeholder, .block-head textarea::placeholder{color:#8A9484;font-weight:400;}
  .del-btn{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    cursor:pointer;
    padding:2px 6px;
    flex-shrink:0;
  }
  .del-btn:hover{color:var(--orange);}
  .explain-row textarea{
    width:100%;
    border:none;
    background:transparent;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    color:var(--ink);
    outline:none;
    resize:vertical;
    min-height:20px;
    padding:4px 0 0 22px;
    line-height:1.5;
    font-style:italic;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .toolbar.materiaal{background:#FBFBF8;}
  .swatches{display:flex;gap:6px;}
  .swatch{
    width:20px;height:20px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .swatch.active{border-color:var(--ink);}
  .tool-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    border-radius:3px;
    padding:5px 9px;
    cursor:pointer;
  }
  .tool-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
  .tool-btn.active{border-color:var(--green);color:var(--green);background:var(--green-soft);}
  .divider{width:1px;align-self:stretch;background:var(--line);}

  .stamp-group{display:flex;align-items:center;gap:0;}
  .stamp-btn{
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.02em;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    border-radius:3px 0 0 3px;
    padding:4px 8px 4px 6px;
    cursor:pointer;
  }
  .stamp-group select{
    border:1.5px solid var(--line);
    border-left:none;
    background:var(--card);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    border-radius:0 3px 3px 0;
    padding:4px 4px;
    cursor:pointer;
    outline:none;
  }
  .stamp-btn.solo{border-radius:3px;}
  .stamp-btn svg{display:block;}
  .stamp-btn:hover{border-color:var(--ink-soft);color:var(--ink);}
  .stamp-btn.active{border-color:var(--orange);color:var(--orange);background:var(--orange-soft);}

  .toolbar.animatie{background:#F3F0F9;}
  .step-dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
  .step-dot{
    width:22px;height:22px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    cursor:pointer;
    padding:0;
  }
  .step-dot:hover{border-color:#9C4FC9;color:#9C4FC9;}
  .step-dot.active{border-color:#9C4FC9;color:#9C4FC9;background:#F3F0F9;}
  .step-empty{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .canvas-wrap{
    position:relative;
    width:100%;
    aspect-ratio:500/280;
    touch-action:none;
    background:#FDFDFB;
    overflow:hidden;
  }
  .canvas-wrap svg.court, .canvas-wrap canvas{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    display:block;
  }
  .canvas-wrap.stamping{cursor:crosshair;}

  .placed-icon{
    position:absolute;
    cursor:grab;
    touch-action:none;
    user-select:none;
    transition:none;
    transform:translate(-50%, -50%);
  }
  .placed-icon:active{cursor:grabbing;}
  .placed-icon svg{width:100%;height:100%;display:block;}
  .icon-del{
    position:absolute;
    top:-7px;right:-7px;
    width:16px;height:16px;
    border:none;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    line-height:16px;
    text-align:center;
    padding:0;
    cursor:pointer;
    opacity:0;
    transition:opacity .12s;
  }
  .placed-icon:hover .icon-del,
  .placed-icon:focus-within .icon-del{opacity:1;}
  @media (hover:none){
    .icon-del{opacity:1;}
  }

  .add-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:26px 0 10px;
    flex-wrap:wrap;
  }
  .add-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    border:1.5px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    border-radius:4px;
    padding:10px 18px;
    cursor:pointer;
  }
  .add-btn:hover{border-color:var(--green);color:var(--green);}
  .print-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:#fff;
    border-radius:4px;
    padding:10px 18px;
    cursor:pointer;
  }
  .print-btn:hover{background:var(--green);border-color:var(--green);}

  @media print{
    body{padding:0;background:#fff;}
    .add-row{display:none;}
    .toolbar{display:none !important;}
    .del-btn{display:none;}
    .icon-del{display:none;}
    .block{break-inside:avoid;border-color:#999;}
    .infobar input{border-bottom-color:#999;}
    .explain-row textarea{font-style:normal;}
  }

  @media (max-width:600px){
    .infobar{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Trainingsbord — Korfbal</h1>
    <span class="tag" id="datestamp"></span>
  </div>

  <div class="infobar">
    <div><label>Datum</label><input type="text" id="fDatum" placeholder="dd-mm-jjjj"></div>
    <div><label>Team</label><input type="text" id="fTeam" placeholder="bijv. A1"></div>
    <div><label>Doel van de training</label><input type="text" id="fDoel" placeholder="korte omschrijving"></div>
  </div>

  <div id="blocks"></div>

  <div class="add-row">
    <button class="add-btn" id="addBlock">+ Oefening toevoegen</button>
    <button class="print-btn" id="printBtn">Printen / PDF</button>
  </div>

</div>

<script>
const PENCOLORS = ['#1B2A4A', '#E4602F', '#2F5233', '#9C4FC9'];
const DISCCOLORS = [
  {name:'Blauw', hex:'#2F6FE4'},
  {name:'Oranje', hex:'#E4602F'},
  {name:'Groen', hex:'#2F5233'},
  {name:'Geel', hex:'#F2C94C'}
];
const ICON_SIZES = { pion:30, paal:30, bal:30, ladder:30, schijfje:26, speler:32 };
let blockCount = 0;

const STATIC_ICONS = {
  pion: `<svg viewBox="0 0 34 34"><polygon points="17,6 24,26 10,26" fill="#E4602F"/><rect x="8" y="26" width="18" height="3" rx="1" fill="#1B2A4A"/></svg>`,
  paal: `<svg viewBox="0 0 34 34"><circle cx="17" cy="10" r="7" fill="none" stroke="#F2C94C" stroke-width="3"/><line x1="17" y1="17" x2="17" y2="29" stroke="#1B2A4A" stroke-width="2.5"/><line x1="10" y1="29" x2="24" y2="29" stroke="#1B2A4A" stroke-width="2.5"/></svg>`,
  bal: `<svg viewBox="0 0 34 34"><defs><clipPath id="ballclip"><circle cx="17" cy="17" r="11"/></clipPath></defs><g clip-path="url(#ballclip)"><path d="M17,17 L17,6 A11,11 0 0,1 26.53,11.5 Z" fill="#2F6FE4"/><path d="M17,17 L26.53,11.5 A11,11 0 0,1 26.53,22.5 Z" fill="#F2C94C"/><path d="M17,17 L26.53,22.5 A11,11 0 0,1 17,28 Z" fill="#2F6FE4"/><path d="M17,17 L17,28 A11,11 0 0,1 7.47,22.5 Z" fill="#F2C94C"/><path d="M17,17 L7.47,22.5 A11,11 0 0,1 7.47,11.5 Z" fill="#2F6FE4"/><path d="M17,17 L7.47,11.5 A11,11 0 0,1 17,6 Z" fill="#F2C94C"/></g><circle cx="17" cy="17" r="11" fill="none" stroke="#1B2A4A" stroke-width="1.5"/></svg>`,
  ladder: `<svg viewBox="0 0 34 34"><line x1="11" y1="4" x2="11" y2="30" stroke="#1B2A4A" stroke-width="2"/><line x1="23" y1="4" x2="23" y2="30" stroke="#1B2A4A" stroke-width="2"/><line x1="11" y1="8" x2="23" y2="8" stroke="#E4602F" stroke-width="2.5"/><line x1="11" y1="14" x2="23" y2="14" stroke="#E4602F" stroke-width="2.5"/><line x1="11" y1="20" x2="23" y2="20" stroke="#E4602F" stroke-width="2.5"/><line x1="11" y1="26" x2="23" y2="26" stroke="#E4602F" stroke-width="2.5"/></svg>`
};

function schijfjeIcon(hex){
  return `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="9" fill="${hex}" stroke="#1B2A4A" stroke-width="1"/></svg>`;
}
function spelerIcon(num){
  const n = parseInt(num, 10);
  const color = n <= 11 ? '#D6413B' : '#1B2A4A';
  return `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="${color}"/><text x="17" y="17" text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Mono, monospace" font-size="${n>9?'12':'14'}" font-weight="600" fill="#fff">${num}</text></svg>`;
}
function iconMarkup(type, extra){
  if(type === 'schijfje') return schijfjeIcon(extra);
  if(type === 'speler') return spelerIcon(extra);
  return STATIC_ICONS[type];
}

function courtSVG(){
  return `
  <svg class="court" viewBox="0 0 500 280" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <rect x="8" y="8" width="484" height="264" fill="#EAF1FB"/>
    <rect x="20" y="20" width="460" height="240" fill="#FDFDFB" stroke="#2F6FE4" stroke-width="2.5"/>
    <line x1="250" y1="20" x2="250" y2="260" stroke="#2F6FE4" stroke-width="1.5"/>
    <path d="M125.7 111 A29 29 0 0 1 125.7 169 L96.7 169 A29 29 0 0 1 96.7 111 Z" fill="none" stroke="#8C97A8" stroke-width="1.8"/>
    <path d="M374.3 111 A29 29 0 0 0 374.3 169 L403.3 169 A29 29 0 0 0 403.3 111 Z" fill="none" stroke="#8C97A8" stroke-width="1.8"/>
    <circle cx="125.7" cy="140" r="29" fill="none" stroke="#8C97A8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="374.3" cy="140" r="29" fill="none" stroke="#8C97A8" stroke-width="1.2" stroke-dasharray="3,3"/>
    <circle cx="125.7" cy="140" r="3" fill="#2F6FE4"/>
    <circle cx="374.3" cy="140" r="3" fill="#2F6FE4"/>
  </svg>`;
}

function numberOptions(){
  let out = '';
  for(let i=1;i<=22;i++) out += `<option value="${i}">${i}</option>`;
  return out;
}
function discOptions(){
  return DISCCOLORS.map(c => `<option value="${c.hex}">${c.name}</option>`).join('');
}

function makeBlock(){
  blockCount++;
  const id = 'c' + blockCount;
  const div = document.createElement('div');
  div.className = 'block';
  div.innerHTML = `
    <div class="block-head">
      <div class="title-row">
        <span class="block-num">${String(blockCount).padStart(2,'0')}</span>
        <input type="text" placeholder="Titel van de oefening">
        <button class="del-btn" title="Verwijderen">verwijder</button>
      </div>
      <div class="explain-row">
        <textarea rows="1" placeholder="Korte uitleg van de oefening..."></textarea>
      </div>
    </div>
    <div class="toolbar">
      <div class="swatches">
        ${PENCOLORS.map((c,i)=>`<button class="swatch${i===0?' active':''}" style="background:${c}" data-color="${c}"></button>`).join('')}
      </div>
      <button class="tool-btn" data-action="eraser">Gum</button>
      <div class="divider"></div>
      <button class="tool-btn" data-action="line">Lijn</button>
      <button class="tool-btn" data-action="arrow">Pijl</button>
      <div class="divider"></div>
      <button class="tool-btn" data-action="undo">Undo</button>
      <button class="tool-btn" data-action="clear">Wis alles</button>
    </div>
    <div class="toolbar materiaal">
      <button class="stamp-btn solo" data-stamp="pion">${STATIC_ICONS.pion} Pion</button>
      <button class="stamp-btn solo" data-stamp="paal">${STATIC_ICONS.paal} Paal</button>
      <button class="stamp-btn solo" data-stamp="bal">${STATIC_ICONS.bal} Bal</button>
      <button class="stamp-btn solo" data-stamp="ladder">${STATIC_ICONS.ladder} Speedladder</button>
      <div class="stamp-group">
        <button class="stamp-btn" data-stamp="schijfje">${schijfjeIcon('#2F6FE4')} Schijfje</button>
        <select data-role="disc-color">${discOptions()}</select>
      </div>
      <div class="stamp-group">
        <button class="stamp-btn" data-stamp="speler">${spelerIcon(1)} Speler</button>
        <select data-role="player-num">${numberOptions()}</select>
      </div>
    </div>
    <div class="toolbar animatie">
      <button class="tool-btn" data-action="capture">● Stap vastleggen</button>
      <div class="step-dots" data-role="step-dots"><span class="step-empty">nog geen stappen</span></div>
      <button class="tool-btn" data-action="play">▶ Afspelen</button>
      <button class="tool-btn" data-action="reset-anim">Wis animatie</button>
    </div>
    <div class="canvas-wrap" id="wrap-${id}">
      ${courtSVG()}
      <canvas id="${id}"></canvas>
    </div>
  `;
  document.getElementById('blocks').appendChild(div);

  div.querySelector('.del-btn').addEventListener('click', () => div.remove());

  const textarea = div.querySelector('.explain-row textarea');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  });

  const canvasAPI = initCanvas(div, id);
  initStamps(div, id);
  initAnimation(div, id, canvasAPI);
}

function initCanvas(scope, id){
  const wrapEl = scope.querySelector('#wrap-' + id);
  const canvas = scope.querySelector('#' + id);
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let currentColor = PENCOLORS[0];
  let tool = 'pen'; // pen | eraser | line | arrow
  let strokes = [];
  let currentStroke = null;

  function resize(){
    const rect = wrapEl.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.setTransform(ratio,0,0,ratio,0,0);
    redraw();
  }

  function drawArrowhead(p0, p1, color){
    const angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
    const len = 14;
    const spread = 0.45;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p1.x - len * Math.cos(angle - spread), p1.y - len * Math.sin(angle - spread));
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p1.x - len * Math.cos(angle + spread), p1.y - len * Math.sin(angle + spread));
    ctx.stroke();
  }

  function redraw(){
    const rect = wrapEl.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    strokes.forEach(s => {
      if(s.points.length < 2) return;
      ctx.strokeStyle = s.erase ? '#FDFDFB' : s.color;
      ctx.lineWidth = s.erase ? 18 : 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      if(s.type === 'line' || s.type === 'arrow'){
        const last = s.points[s.points.length - 1];
        ctx.lineTo(last.x, last.y);
        ctx.stroke();
        if(s.type === 'arrow') drawArrowhead(s.points[0], last, s.color);
      } else {
        s.points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();
      }
    });
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function start(e){
    if(wrapEl.dataset.stampMode){
      placeStamp(scope, wrapEl, wrapEl.dataset.stampMode, e);
      return;
    }
    e.preventDefault();
    drawing = true;
    const p = getPos(e);
    if(tool === 'line' || tool === 'arrow'){
      currentStroke = { type: tool, color: currentColor, points: [p, p] };
    } else {
      currentStroke = { type: 'freehand', color: currentColor, erase: tool === 'eraser', points: [p] };
    }
    strokes.push(currentStroke);
  }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = getPos(e);
    if(tool === 'line' || tool === 'arrow'){
      currentStroke.points[1] = p;
    } else {
      currentStroke.points.push(p);
    }
    redraw();
  }
  function end(){ drawing = false; currentStroke = null; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  const toolButtons = [
    scope.querySelector('[data-action="eraser"]'),
    scope.querySelector('[data-action="line"]'),
    scope.querySelector('[data-action="arrow"]')
  ];

  function setTool(newTool, btn){
    tool = newTool;
    scope.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    toolButtons.forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    exitStampMode(scope, wrapEl);
  }

  scope.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      currentColor = sw.dataset.color;
      setTool('pen', null);
      sw.classList.add('active');
    });
  });
  scope.querySelector('[data-action="eraser"]').addEventListener('click', (e) => {
    setTool('eraser', e.currentTarget);
  });
  scope.querySelector('[data-action="line"]').addEventListener('click', (e) => {
    setTool('line', e.currentTarget);
  });
  scope.querySelector('[data-action="arrow"]').addEventListener('click', (e) => {
    setTool('arrow', e.currentTarget);
  });
  scope.querySelector('[data-action="undo"]').addEventListener('click', () => {
    strokes.pop();
    redraw();
  });
  scope.querySelector('[data-action="clear"]').addEventListener('click', () => {
    strokes = [];
    redraw();
  });

  window.addEventListener('resize', resize);
  setTimeout(resize, 50);

  return {
    getStrokes: () => strokes,
    setStrokes: (s) => { strokes = s; redraw(); }
  };
}

function exitStampMode(scope, wrapEl){
  delete wrapEl.dataset.stampMode;
  wrapEl.classList.remove('stamping');
  scope.querySelectorAll('.stamp-btn').forEach(b => b.classList.remove('active'));
}

function initStamps(scope, id){
  const wrapEl = scope.querySelector('#wrap-' + id);
  const stampButtons = scope.querySelectorAll('.stamp-btn');

  stampButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.stamp;
      const wasActive = btn.classList.contains('active');
      exitStampMode(scope, wrapEl);
      if(!wasActive){
        btn.classList.add('active');
        wrapEl.dataset.stampMode = type;
        wrapEl.classList.add('stamping');
      }
    });
  });
}

function placeStamp(scope, wrapEl, type, e){
  e.preventDefault();
  const rect = wrapEl.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  const fx = Math.min(1, Math.max(0, (t.clientX - rect.left) / rect.width));
  const fy = Math.min(1, Math.max(0, (t.clientY - rect.top) / rect.height));
  const extra = type === 'schijfje'
    ? scope.querySelector('[data-role="disc-color"]').value
    : type === 'speler'
      ? scope.querySelector('[data-role="player-num"]').value
      : null;
  createIcon(wrapEl, type, extra, fx, fy);
}

function createIcon(wrapEl, type, extra, fx, fy){
  const size = ICON_SIZES[type] || 30;
  const el = document.createElement('div');
  el.className = 'placed-icon';
  el.dataset.type = type;
  if(extra !== null && extra !== undefined) el.dataset.extra = extra;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.left = (fx * 100) + '%';
  el.style.top = (fy * 100) + '%';
  el.innerHTML = iconMarkup(type, extra) + '<button type="button" class="icon-del" aria-label="Verwijder">&times;</button>';
  wrapEl.appendChild(el);
  makeIconDraggable(wrapEl, el);
  return el;
}

function makeIconDraggable(wrapEl, el){
  let dragging = false;
  function xy(e){
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function start(e){
    if(e.target.closest('.icon-del')) return;
    e.preventDefault();
    e.stopPropagation();
    dragging = true;
  }
  function move(e){
    if(!dragging) return;
    e.preventDefault();
    const rect = wrapEl.getBoundingClientRect();
    const p = xy(e);
    const fx = Math.min(1, Math.max(0, (p.x - rect.left) / rect.width));
    const fy = Math.min(1, Math.max(0, (p.y - rect.top) / rect.height));
    el.style.left = (fx * 100) + '%';
    el.style.top = (fy * 100) + '%';
  }
  function end(){ dragging = false; }
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive:false});
  window.addEventListener('mousemove', move);
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('mouseup', end);
  window.addEventListener('touchend', end);
  el.querySelector('.icon-del').addEventListener('click', (e) => {
    e.stopPropagation();
    el.remove();
  });
}

function initAnimation(scope, id, canvasAPI){
  const wrapEl = scope.querySelector('#wrap-' + id);
  const dotsWrap = scope.querySelector('[data-role="step-dots"]');
  let steps = [];
  let activeStep = -1;
  let playTimer = null;

  function snapshotIcons(){
    return Array.from(wrapEl.querySelectorAll('.placed-icon')).map(el => ({
      type: el.dataset.type,
      extra: el.dataset.extra !== undefined ? el.dataset.extra : null,
      fx: parseFloat(el.style.left) / 100,
      fy: parseFloat(el.style.top) / 100
    }));
  }

  function applyIcons(list){
    wrapEl.querySelectorAll('.placed-icon').forEach(el => el.remove());
    list.forEach(ic => createIcon(wrapEl, ic.type, ic.extra, ic.fx, ic.fy));
  }

  function renderDots(){
    dotsWrap.innerHTML = '';
    if(steps.length === 0){
      dotsWrap.innerHTML = '<span class="step-empty">nog geen stappen</span>';
      return;
    }
    steps.forEach((s, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'step-dot' + (i === activeStep ? ' active' : '');
      dot.textContent = i + 1;
      dot.title = 'Stap ' + (i + 1) + ' tonen';
      dot.addEventListener('click', () => {
        stopPlaying();
        goToStep(i);
      });
      dotsWrap.appendChild(dot);
    });
  }

  function goToStep(i){
    if(i < 0 || i >= steps.length) return;
    activeStep = i;
    canvasAPI.setStrokes(JSON.parse(JSON.stringify(steps[i].strokes)));
    applyIcons(steps[i].icons);
    renderDots();
  }

  function stopPlaying(){
    if(playTimer){
      clearInterval(playTimer);
      playTimer = null;
    }
  }

  scope.querySelector('[data-action="capture"]').addEventListener('click', () => {
    steps.push({
      strokes: JSON.parse(JSON.stringify(canvasAPI.getStrokes())),
      icons: snapshotIcons()
    });
    activeStep = steps.length - 1;
    renderDots();
  });

  scope.querySelector('[data-action="play"]').addEventListener('click', () => {
    if(steps.length === 0) return;
    stopPlaying();
    let i = 0;
    goToStep(0);
    playTimer = setInterval(() => {
      i++;
      if(i >= steps.length){
        stopPlaying();
        return;
      }
      goToStep(i);
    }, 1000);
  });

  scope.querySelector('[data-action="reset-anim"]').addEventListener('click', () => {
    stopPlaying();
    steps = [];
    activeStep = -1;
    renderDots();
  });
}

function todayStr(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}-${mm}-${d.getFullYear()}`;
}

document.getElementById('datestamp').textContent = todayStr();
document.getElementById('fDatum').value = todayStr();
document.getElementById('addBlock').addEventListener('click', makeBlock);
document.getElementById('printBtn').addEventListener('click', () => window.print());
makeBlock();
</script>
